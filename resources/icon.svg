<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="128" height="128" rx="16" fill="#2C3E50"/>

  <!-- Notebook icon -->
  <g>
    <!-- Notebook pages -->
    <rect x="28" y="20" width="72" height="88" rx="4" fill="#ECF0F1"/>
    <rect x="32" y="24" width="64" height="80" rx="2" fill="#FFFFFF"/>

    <!-- Notebook binding -->
    <rect x="24" y="20" width="8" height="88" rx="2" fill="#E74C3C"/>
    <circle cx="28" cy="35" r="2" fill="#C0392B"/>
    <circle cx="28" cy="50" r="2" fill="#C0392B"/>
    <circle cx="28" cy="65" r="2" fill="#C0392B"/>
    <circle cx="28" cy="80" r="2" fill="#C0392B"/>
    <circle cx="28" cy="95" r="2" fill="#C0392B"/>

    <!-- Markdown symbol -->
    <text x="64" y="70" font-family="monospace" font-size="32" font-weight="bold" fill="#3498DB" text-anchor="middle">M↓</text>
  </g>

  <!-- Git branch icon (small) -->
  <g transform="translate(82, 88)">
    <circle cx="8" cy="0" r="4" fill="#27AE60" stroke="#FFFFFF" stroke-width="1.5"/>
    <circle cx="8" cy="12" r="4" fill="#27AE60" stroke="#FFFFFF" stroke-width="1.5"/>
    <line x1="8" y1="4" x2="8" y2="8" stroke="#27AE60" stroke-width="2"/>
  </g>
</svg>
